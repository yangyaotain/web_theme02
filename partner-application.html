<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部伙伴应用 · 灵拓数据聚合服务平台</title>
    <link rel="icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/service-content-preview.css">
    <link rel="stylesheet" href="css/partner-detail.css">
    <link rel="stylesheet" href="css/catalog-cards.css">
    <link rel="stylesheet" href="css/ecosystem-partners.css">
    <link rel="stylesheet" href="css/partner-application.css">
</head>
<body class="partner-application">
    <nav-bar active="data-services"></nav-bar>
    <main class="preview-shell">
        <nav class="g-breadcrumb" aria-label="当前位置">
            <a href="index.html">首页</a><span class="sep">/</span><span>应用聚合</span><span class="sep">/</span><span class="current" aria-current="page">全部伙伴应用</span>
        </nav>
        <header class="application-list-header"><h1 class="page-title">全部伙伴应用</h1></header>
        <section class="application-catalog" aria-label="全部伙伴应用">
            <div class="partner-directory-tools">
                <p class="application-results" data-application-count role="status"></p>
                <form class="partner-directory-search" data-application-search role="search">
                    <input type="search" name="keyword" aria-label="搜索应用名称、所属伙伴或应用简介" placeholder="搜索应用、伙伴或简介" autocomplete="off">
                    <button type="submit" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg><span>搜索</span>
                    </button>
                </form>
            </div>
            <div class="data-grid" data-application-grid></div>
            <p class="partner-detail-empty" data-application-empty hidden role="status">暂无已发布的伙伴应用</p>
            <nav class="pagination" aria-label="伙伴应用分页">
                <button class="pagination-btn" type="button" disabled><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span><span>上一页</span></button>
                <div class="pagination-numbers"></div>
                <button class="pagination-btn" type="button" disabled><span>下一页</span><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
            </nav>
        </section>
    </main>
    <script src="js/partner-store.js"></script>
    <script src="js/partner-ui.js"></script>
    <script src="js/nav-bar.js"></script>
    <script src="js/domain-filter.js"></script>
    <script src="js/partner-application.js"></script>
</body>
</html>
