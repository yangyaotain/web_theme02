<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全要素展示驾驶舱2 - 客户驾驶舱</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="dashboard-v2.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="dashboard-v2-data.js" defer></script>
  <script src="dashboard-v2.js" defer></script>
</head>
<body data-screen="market">
  <div data-dashboard-header></div>

  <main class="dashboard-main">
    <section class="metric-grid" data-metric-grid aria-label="客户驾驶舱核心指标"></section>

    <section class="dashboard-grid">
      <article class="panel panel--main span-7">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-area-chart" aria-hidden="true"></i>全要素供给分布</h3>
            <p class="panel__subtitle">按核心行业查看资源、产品、咨询与方案供给结构</p>
          </div>
          <span class="panel__badge">市场全景</span>
        </header>
        <div class="chart-box">
          <canvas id="marketPrimaryChart" aria-label="全要素供给分布图"></canvas>
        </div>
      </article>

      <article class="panel panel--main span-5" data-ranking="market">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-star" aria-hidden="true"></i>市场热点排行</h3>
            <p class="panel__subtitle">统一查看热门资源、产品、咨询、方案和需求</p>
          </div>
          <div class="panel-tabs" role="tablist" aria-label="市场排行分类" data-ranking-tabs></div>
        </header>
        <div class="ranking-list" data-ranking-list></div>
      </article>
    </section>

    <section class="dashboard-grid">
      <article class="panel panel--secondary span-7">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-line-chart" aria-hidden="true"></i>市场交易与需求响应趋势</h3>
            <p class="panel__subtitle">同时观察市场活跃度和需求承接能力</p>
          </div>
          <span class="panel__badge">趋势判断</span>
        </header>
        <div class="chart-box">
          <canvas id="marketTrendChart" aria-label="市场趋势图"></canvas>
        </div>
      </article>

      <article class="panel panel--secondary span-5">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-pie-chart" aria-hidden="true"></i>供需结构分布</h3>
            <p class="panel__subtitle">整合产品交付方式和当前需求状态</p>
          </div>
          <span class="panel__badge">结构分布</span>
        </header>
        <div class="dual-chart">
          <div class="dual-chart__item">
            <p class="dual-chart__label">产品交付方式</p>
            <div class="dual-chart__canvas">
              <canvas id="marketLeftDonutChart" aria-label="左侧结构分布图"></canvas>
            </div>
          </div>
          <div class="dual-chart__item">
            <p class="dual-chart__label">需求状态</p>
            <div class="dual-chart__canvas">
              <canvas id="marketRightDonutChart" aria-label="需求状态分布图"></canvas>
            </div>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
