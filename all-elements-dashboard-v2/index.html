<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全要素展示驾驶舱</title>
  <link rel="stylesheet" href="dashboard-v2.css">
  <script src="dashboard-v2.js" defer></script>
</head>
<body>
  <main class="dashboard-viewer" aria-label="全要素展示驾驶舱">
    <div class="dashboard-frame">
      <img
        class="dashboard-screen"
        src="images/dashboard-two-view-01-scale-service.png"
        alt="数据聚合与服务能力全景—规模流通与服务"
        width="1920"
        height="1080"
        draggable="false"
        data-dashboard-screen
      >

      <nav class="dashboard-hotspots" aria-label="驾驶舱主题切换">
        <a class="dashboard-hotspot dashboard-hotspot--scale" href="#scale" data-screen-link="scale">
          <span class="screen-reader-only">规模流通与服务</span>
        </a>
        <a class="dashboard-hotspot dashboard-hotspot--ecosystem" href="#ecosystem" data-screen-link="ecosystem">
          <span class="screen-reader-only">生态安全与成效</span>
        </a>
      </nav>
    </div>
  </main>

  <div class="screen-reader-only" role="status" aria-live="polite" data-live-status></div>
</body>
</html>
