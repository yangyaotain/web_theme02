<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全要素展示驾驶舱2 - 领导驾驶舱</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="dashboard-v2.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="dashboard-v2-data.js" defer></script>
  <script src="dashboard-v2.js" defer></script>
</head>
<body data-screen="leader">
  <div data-dashboard-header></div>

  <main class="dashboard-main">
    <section class="metric-grid" data-metric-grid aria-label="领导驾驶舱核心指标"></section>

    <section class="dashboard-grid">
      <article class="panel panel--main span-7">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-line-chart" aria-hidden="true"></i>平台规模与交易趋势</h3>
            <p class="panel__subtitle">统一观察资源、产品、咨询、方案供给规模和成交金额</p>
          </div>
          <span class="panel__badge">供给与价值</span>
        </header>
        <div class="chart-box">
          <canvas id="leaderPlatformTrendChart" aria-label="平台规模与交易趋势图"></canvas>
        </div>
      </article>

      <article class="panel panel--main span-5">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-tasks" aria-hidden="true"></i>需求响应态势</h3>
            <p class="panel__subtitle">新增、响应与成功需求采用同一统计周期</p>
          </div>
          <span class="panel__badge">成功覆盖 78.6%</span>
        </header>
        <div class="chart-box">
          <canvas id="leaderDemandTrendChart" aria-label="需求响应态势图"></canvas>
        </div>
      </article>
    </section>

    <section class="dashboard-grid">
      <article class="panel panel--secondary span-7">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-industry" aria-hidden="true"></i>重点行业供给结构</h3>
            <p class="panel__subtitle">以指数方式比较不同行业的资源、产品、咨询和方案供给能力</p>
          </div>
          <span class="panel__badge">10个核心行业</span>
        </header>
        <div class="chart-box">
          <canvas id="leaderIndustryChart" aria-label="重点行业供给结构图"></canvas>
        </div>
      </article>

      <article class="panel panel--secondary span-5" data-ranking="leader">
        <header class="panel__head">
          <div class="panel__title-wrap">
            <h3 class="panel__title"><i class="fa fa-trophy" aria-hidden="true"></i>市场热点排行</h3>
            <p class="panel__subtitle">聚合产品、咨询、方案和需求热点</p>
          </div>
          <div class="panel-tabs" role="tablist" aria-label="市场热点排行分类" data-ranking-tabs></div>
        </header>
        <div class="ranking-list" data-ranking-list></div>
      </article>
    </section>
  </main>
</body>
</html>
