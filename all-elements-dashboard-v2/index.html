<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全要素展示驾驶舱</title>
  <link rel="stylesheet" href="dashboard-v2.css">
  <script src="dashboard-v2.js" defer></script>
</head>
<body>
  <main class="dashboard-viewer" aria-label="全要素展示驾驶舱">
    <div class="dashboard-frame">
      <img
        class="dashboard-screen"
        src="images/dashboard-screen-resources.png"
        alt="数据资源与聚合大屏"
        width="3840"
        height="2160"
        draggable="false"
        data-dashboard-screen
      >

      <nav class="dashboard-hotspots" aria-label="驾驶舱主题切换">
        <a class="dashboard-hotspot dashboard-hotspot--resources" href="#resources" data-screen-link="resources">
          <span class="screen-reader-only">数据资源与聚合</span>
        </a>
        <a class="dashboard-hotspot dashboard-hotspot--processing" href="#processing" data-screen-link="processing">
          <span class="screen-reader-only">数据加工与产品服务</span>
        </a>
        <a class="dashboard-hotspot dashboard-hotspot--applications" href="#applications" data-screen-link="applications">
          <span class="screen-reader-only">行业应用与价值成果</span>
        </a>
      </nav>
    </div>
  </main>

  <div class="screen-reader-only" role="status" aria-live="polite" data-live-status></div>
</body>
</html>
