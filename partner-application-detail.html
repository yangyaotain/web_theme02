<body class="partner-application">
    <div class="preview-bar" data-preview-bar hidden>
        <span class="preview-badge">预览</span><span>共创伙伴应用展示预览</span>
        <button type="button" class="preview-close" data-preview-close>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg><span>关闭预览</span>
        </button>
    </div>
    <div data-partner-navigation></div>
    <main class="preview-shell">
        <nav class="g-breadcrumb" aria-label="当前位置" data-partner-breadcrumb>
            <a href="index.html">首页</a><span class="sep">/</span><a href="partner-application.html" data-application-return>全部伙伴应用</a><span class="sep">/</span><span class="current" data-partner-name aria-current="page"></span>
        </nav>
        <article class="preview-article" data-partner-article hidden>
            <header class="preview-hero">
                <div class="preview-hero-main" data-hero>
                    <img class="partner-detail-background" data-hero-image alt="">
                    <div class="preview-hero-content">
                        <span class="preview-kicker" data-badge></span>
                        <h1 class="preview-title" data-title></h1>
                        <p class="preview-subtitle" data-subtitle></p>
                    </div>
                </div>
            </header>
            <div class="preview-body">
                <p class="preview-lead" data-lead></p><div data-sections></div>
            </div>
        </article>
        <p class="partner-detail-empty" data-empty hidden role="status"></p>
    </main>

    <script src="js/partner-ui.js"></script>
