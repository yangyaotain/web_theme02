<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵拓 · 数据聚合服务平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        /* ── Main Layout ── */
        .main-content {
            max-width: var(--content-max-width); margin: 0 auto; padding: 96px 32px 48px;
            display: grid; grid-template-columns: minmax(0, 1fr);
        }

        /* ── Article Content ── */
        .article {
            background: var(--surface-elevated); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-2xl); box-shadow: var(--shadow-md); overflow: hidden;
        }
        #lineDetail { scroll-margin-top: 88px; }
        .article-hero {
            position: relative; height: 400px;
            background: center/cover no-repeat;
        }
        .article-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .article-hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
        }
        .article-hero-content {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 48px; color: white;
        }
        .article-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; background: rgba(32,165,101,0.9);
            border-radius: var(--radius-md); font-size: 12px; font-weight: 600;
            margin-bottom: 16px;
        }
        .article-badge svg { width: 14px; height: 14px; fill: currentColor; }
        .article-badge .material-symbols-outlined { font-size: 14px; }
        .article-title {
            font-size: 42px; font-weight: 800; line-height: 1.1;
            letter-spacing: -0.03em; margin-bottom: 12px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .article-subtitle {
            font-size: 18px; opacity: 0.9; max-width: 600px; line-height: 1.6;
        }

        /* ── Article Body ── */
        .article-body { padding: 48px; }
        .article-lead {
            font-size: 20px; line-height: 1.8; color: var(--text-secondary);
            border-left: 4px solid var(--forest-green);
            padding-left: 24px; margin-bottom: 48px;
        }

        /* ── Section ── */
        .article-section { margin-bottom: 48px; }
        .section-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .section-number {
            width: 48px; height: 48px; background: var(--forest-green);
            color: white; font-size: 20px; font-weight: 700;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .section-title {
            font-size: 24px; font-weight: 700; color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .section-content {
            font-size: 16px; color: var(--text-secondary); line-height: 1.9;
            margin-left: 64px;
        }
        .section-content p + p, .content-text p + p { margin-top: 12px; }
        .article-title, .article-subtitle, .section-title, .section-content, .content-text, .case-card { overflow-wrap: anywhere; }

        /* ── Case Grid ── */
        .case-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-left: 64px; margin-top: 20px;
        }
        .case-card {
            background: var(--surface-secondary); border-radius: var(--radius-xl);
            padding: 24px; border: 1px solid var(--border-subtle);
            transition: all var(--transition-base); box-shadow: var(--shadow-sm);
        }
        .case-card:hover { border-color: var(--forest-green-200); box-shadow: var(--shadow-md); transform: translateY(-4px); }
        .case-card-icon {
            width: 48px; height: 48px; background: var(--forest-green-100);
            border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
        }
        .case-card-icon svg { width: 24px; height: 24px; fill: var(--forest-green); }
        .case-card-icon {
            display: grid; place-items: center; overflow: hidden; color: var(--forest-green); font-weight: 700;
        }
        .case-card-icon img { width: 100%; height: 100%; object-fit: cover; }
        .case-card-wide { grid-column: 1 / -1; }
        .case-card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .case-card-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.6; }

        /* ── Content with Image ── */
        .content-with-image {
            display: grid; grid-template-columns: 1fr 400px;
            gap: 40px; margin-left: 64px; margin-top: 16px;
        }
        .content-text { font-size: 16px; color: var(--text-secondary); line-height: 1.9; }
        .content-image {
            border-radius: var(--radius-xl); overflow: hidden;
            box-shadow: var(--shadow-md); height: fit-content;
        }
        .content-image img { width: 100%; height: auto; display: block; }
        .line-image-row {
            display: grid; grid-template-columns: var(--line-grid-columns); align-items: start;
            gap: 20px; margin: 16px 0 0 64px;
        }
        .line-image-row[data-layout="left-right"] { grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 40px; }
        .line-empty { padding: 48px 24px; text-align: center; color: var(--text-secondary); }
        .line-preview-bar {
            position: fixed; z-index: 1001; top: 0; left: 0; right: 0; min-height: 56px; padding: 10px 32px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            background: var(--surface-elevated); border-bottom: 1px solid var(--border-subtle); font-size: 14px;
        }
        .line-preview-bar button {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
            border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            background: var(--surface-elevated); color: var(--text-primary); font: inherit; cursor: pointer;
        }
        .line-preview-bar button:hover { color: var(--forest-green); border-color: var(--forest-green); }
        .line-preview-bar[hidden] { display: none; }

        /* ── CTA Section ── */
        .cta-section {
            background: linear-gradient(135deg, #0B1A14 0%, #143026 100%);
            border-radius: var(--radius-xl); padding: 48px;
            display: flex; align-items: center; justify-content: space-between; gap: 32px;
            margin-top: 48px;
        }
        .cta-content h3 { font-size: 28px; font-weight: 700; color: white; margin-bottom: 8px; }
        .cta-content p { font-size: 15px; color: rgba(255,255,255,0.7); }
        .cta-button {
            padding: 16px 40px; font-size: 16px; font-weight: 600;
            color: #111827; background: white; border: none;
            border-radius: var(--radius-lg); cursor: pointer;
            transition: all var(--transition-base); white-space: nowrap;
        }
        .cta-button:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(255,255,255,0.2); }

        /* ── Responsive ── */
        @media (max-width: 1200px) {
            .case-grid { grid-template-columns: 1fr; }
            .content-with-image { grid-template-columns: 1fr; }
            .line-image-row, .line-image-row[data-layout="left-right"] { grid-template-columns: minmax(0, 1fr); gap: 16px; }
        }
        @media (max-width: 768px) {
            .article-title { font-size: 28px; }
            .article-hero { height: 300px; }
            .article-hero-content { padding: 24px; }
            .article-body { padding: 24px; }
            .section-content, .case-grid, .content-with-image { margin-left: 0; }
            .line-image-row { margin-left: 0; }
            .cta-section { flex-direction: column; text-align: center; }
        }
    </style>
    <script src="js/data-production-line-store.js"></script>
    <script src="js/nav-bar.js"></script>
    <script src="js/smart-service.js" defer></script>
</head>
<body>
    <nav-bar active="data-services"></nav-bar>
    <div class="line-preview-bar" id="linePreviewBar" hidden>
        <strong>数据生产线门户展示预览</strong>
        <button type="button" id="linePreviewClose"><span class="material-symbols-outlined" aria-hidden="true">close</span><span>关闭预览</span></button>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div id="lineDetail"></div>
    </main>


    <link rel="stylesheet" href="css/feature-introduction.css">
    <script src="js/feature-introduction.js" defer></script>
    <script src="js/data-production-line.js" defer></script>
</body>
</html>
