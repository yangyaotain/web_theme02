<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特色专区 - 龙岗数据聚合服务平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/special-zone.css">
    <script src="js/special-zone-store.js"></script>
    <script src="js/nav-bar.js"></script>
    <script src="js/smart-service.js" defer></script>
</head>
<body>
    <nav-bar active="data-trade"></nav-bar>

    <button class="zone-preview-close" type="button" id="zonePreviewClose" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18.3 5.7-1.4-1.4-4.9 4.9-4.9-4.9-1.4 1.4 4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9 4.9-4.9z"/></svg>
        <span>关闭预览</span>
    </button>

    <main class="special-zone-page" id="specialZonePage">
        <div class="special-zone-shell">
            <nav class="zone-breadcrumb" aria-label="面包屑">
                <a href="index.html">首页</a>
                <span>/</span>
                <a href="data-resources.html">数据交易</a>
                <span>/</span>
                <span>特色专区</span>
                <span>/</span>
                <strong id="zoneBreadcrumbName">专区加载中</strong>
            </nav>

            <section class="zone-hero" id="zoneHero">
                <div class="zone-hero-overlay"></div>
                <div class="zone-hero-content">
                    <span class="zone-kicker">FEATURED DATA ZONE</span>
                    <h1 id="zoneName">专区加载中</h1>
                    <p id="zoneIntroduction"></p>
                    <div class="zone-stats" aria-label="专区收录内容">
                        <div class="zone-stat">
                            <strong id="zoneResourceCount">0</strong>
                            <span>数据资源</span>
                        </div>
                        <i></i>
                        <div class="zone-stat">
                            <strong id="zoneProductCount">0</strong>
                            <span>数据产品</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="zone-content-card" id="zoneContentCard">
                <div class="zone-tabs" role="tablist" aria-label="专区内容类型">
                    <button type="button" class="zone-tab active" data-zone-type="resource" role="tab" aria-selected="true">
                        <span>数据资源</span>
                        <em id="resourceTabCount">0</em>
                    </button>
                    <button type="button" class="zone-tab" data-zone-type="product" role="tab" aria-selected="false">
                        <span>数据产品</span>
                        <em id="productTabCount">0</em>
                    </button>
                </div>

                <div class="zone-search-panel">
                    <form class="zone-content-search" id="zoneSearchForm">
                        <div class="zone-search-input-wrapper">
                            <svg class="zone-search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input id="zoneSearchInput" type="text" placeholder="搜索本专区的数据资源" autocomplete="off">
                        </div>
                        <button type="submit">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3a6.5 6.5 0 1 0 3.98 11.64L19.84 21 21 19.84l-6.36-6.36A6.5 6.5 0 0 0 9.5 3zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
                            <span>搜索</span>
                        </button>
                    </form>
                    <div class="zone-hot-tags">
                        <span>热门：</span>
                        <button type="button" data-zone-keyword="中文语料">中文语料</button>
                        <button type="button" data-zone-keyword="知识库">知识库</button>
                        <button type="button" data-zone-keyword="模型训练">模型训练</button>
                        <button type="button" data-zone-keyword="多模态">多模态</button>
                    </div>
                </div>

                <div class="zone-content-layout">
                    <aside class="zone-filter-sidebar" aria-label="筛选条件">
                        <div class="zone-filter-card">
                            <div id="zoneFilterGroups"></div>
                        </div>
                    </aside>

                    <div class="zone-results-panel">
                        <div class="zone-result-header" id="zoneResultHeader">
                            <div class="zone-result-title">
                                共 <strong id="zoneResultCount">0</strong> 条<span id="zoneResultTitle">数据资源</span>
                            </div>
                            <label class="zone-sort-dropdown">
                                <span>排序：</span>
                                <select id="zoneSortSelect">
                                    <option value="listedAt">上架时间</option>
                                    <option value="apply">申请量</option>
                                    <option value="view">浏览量</option>
                                </select>
                            </label>
                        </div>

                        <div class="zone-active-search" id="zoneActiveSearch" hidden>
                            <span>当前搜索：</span>
                            <strong id="zoneActiveKeyword"></strong>
                            <button type="button" id="zoneClearKeyword" aria-label="清除搜索">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4-6.3-6.3-6.3 6.3-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3 1.4 1.4z"/></svg>
                            </button>
                        </div>

                        <div class="zone-card-grid" id="zoneCardGrid"></div>

                        <div class="zone-empty" id="zoneEmpty" hidden>
                            <div class="zone-empty-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3a6.5 6.5 0 1 0 3.98 11.64L19.84 21 21 19.84l-6.36-6.36A6.5 6.5 0 0 0 9.5 3zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
                            </div>
                            <h2>暂未找到匹配内容</h2>
                            <p>请尝试更换关键词或清空筛选条件。</p>
                            <button type="button" id="zoneEmptyReset">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.7 9H3.2A9 9 0 1 0 5 6.7V3H3v7h7V8H6.4A6.96 6.96 0 0 1 12 5z"/></svg>
                                <span>清空筛选</span>
                            </button>
                        </div>

                        <nav class="zone-pagination" id="zonePagination" aria-label="分页"></nav>
                    </div>
                </div>
            </section>

            <section class="zone-unavailable" id="zoneUnavailable" hidden>
                <div class="zone-unavailable-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 3 3 3h-3V5zM8 13h8v2H8v-2zm0 4h6v2H8v-2z"/></svg>
                </div>
                <h1>专区暂未发布</h1>
                <p>该专区正在配置中，请稍后再来查看。</p>
                <a href="data-resources.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 17 1.4-1.4-2.6-2.6H19v-2H8.8l2.6-2.6L10 7l-5 5 5 5z"/></svg>
                    <span>返回数据资源</span>
                </a>
            </section>
        </div>
    </main>

    <script src="js/special-zone.js"></script>
</body>
</html>
