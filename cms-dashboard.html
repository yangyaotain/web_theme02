<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大屏管理 - 运营中心 - 龙岗数据聚合服务平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/admin-common.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/global-dialog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .ds-cms-layout { display:flex; height:calc(100vh - 64px); min-height:620px; }
        .ds-screen-list { width:180px; flex:none; overflow-y:auto; background:#fff; border-right:1px solid #e4e7ed; }
        .ds-screen-list-title { padding:16px 16px 8px; color:#909399; font-size:13px; font-weight:600; letter-spacing:.03em; }
        .ds-screen-item { display:flex; align-items:center; gap:8px; width:100%; padding:10px 16px; border:0; border-left:3px solid transparent; background:transparent; color:#606266; font-size:13px; line-height:20px; font-family:inherit; text-align:left; cursor:pointer; transition:.15s; }
        .ds-screen-item svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; }
        .ds-screen-item:hover { color:var(--forest-green); background:#f5f7fa; }
        .ds-screen-item.active { color:var(--forest-green); font-weight:600; background:#e8f5e9; border-left-color:var(--forest-green); }
        .ds-workspace { flex:1; min-width:0; overflow-y:auto; padding:24px 28px; background:#f5f7fa; }
        .ds-page { min-height:100%; color:var(--text-primary, #1f2b28); }
        .ds-page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; }
        .ds-page-title { margin:0; font-size:20px; line-height:30px; font-weight:700; color:var(--text-primary, #1f2b28); }
        .ds-page-desc { margin:4px 0 0; font-size:13px; line-height:20px; color:var(--text-tertiary, #919b96); }

        .ds-filter-bar {
            display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:16px;
            margin-bottom:16px; background:#fff; border:1px solid var(--border-divider, #ebeefd);
            border-radius:6px; box-shadow:var(--shadow-sm);
        }
        .ds-input, .ds-select {
            height:34px; box-sizing:border-box; border:1px solid var(--border-default, #d1d9d6);
            border-radius:4px; background:#fff; color:var(--text-primary, #1f2b28);
            font-size:13px; font-family:inherit; outline:none; transition:.15s;
        }
        .ds-input { width:240px; padding:0 11px; }
        .ds-select { min-width:146px; padding:0 30px 0 10px; cursor:pointer; }
        .ds-input:focus, .ds-select:focus { border-color:var(--forest-green); box-shadow:0 0 0 2px rgba(32,165,101,.08); }
        .ds-btn {
            height:34px; padding:0 15px; border:1px solid var(--border-default, #d1d9d6); border-radius:4px;
            background:#fff; color:var(--text-secondary, #5c6863); display:inline-flex; align-items:center;
            justify-content:center; gap:6px; font-size:13px; font-family:inherit; cursor:pointer; transition:.15s;
        }
        .ds-btn:hover { border-color:var(--forest-green); color:var(--forest-green); }
        .ds-btn.primary { background:var(--forest-green); border-color:var(--forest-green); color:#fff; }
        .ds-btn.primary:hover { background:#188b53; border-color:#188b53; }
        .ds-btn svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; }

        .ds-table-card { background:#fff; border:1px solid var(--border-divider, #ebeefd); border-radius:6px; box-shadow:var(--shadow-sm); overflow:hidden; }
        .ds-table-summary { height:46px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-divider, #ebeefd); }
        .ds-table-summary strong { font-size:14px; color:var(--text-primary, #1f2b28); }
        .ds-table-summary span { font-size:12px; color:var(--text-tertiary, #919b96); }
        .ds-table-wrap { overflow:auto; }
        .ds-table { width:100%; min-width:820px; border-collapse:collapse; table-layout:fixed; font-size:13px; }
        .ds-table th { height:44px; padding:0 18px; text-align:left; background:#fafbfc; color:var(--text-secondary, #5c6863); font-weight:600; border-bottom:1px solid var(--border-divider, #ebeefd); white-space:nowrap; }
        .ds-table td { height:56px; padding:0 18px; color:var(--text-secondary, #5c6863); border-bottom:1px solid #f0f2f1; vertical-align:middle; }
        .ds-table tbody tr:hover td { background:#fbfdfc; }
        .ds-table tbody tr:last-child td { border-bottom:none; }
        .ds-name-cell { min-width:0; }
        .ds-name-main { display:flex; align-items:center; gap:8px; min-width:0; }
        .ds-name-text { color:var(--text-primary, #1f2b28); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ds-type-text { color:var(--text-secondary, #5c6863); font-size:13px; }
        .ds-screen-tag { display:inline-flex; align-items:center; padding:3px 9px; border-radius:3px; color:#3f6255; background:#f0f6f3; font-size:12px; }
        .ds-year { font-family:'Inter','Noto Sans SC',sans-serif; color:var(--text-primary, #1f2b28); }

        .ds-status { display:flex; align-items:center; gap:8px; white-space:nowrap; }
        .ds-switch { position:relative; width:38px; height:20px; padding:0; border:0; border-radius:10px; background:#c8cfcc; cursor:pointer; transition:.2s; }
        .ds-switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:.2s; }
        .ds-switch.on { background:var(--forest-green); }
        .ds-switch.on::after { transform:translateX(18px); }
        .ds-status-text { font-size:12px; color:var(--text-tertiary, #919b96); }
        .ds-switch.on + .ds-status-text { color:var(--forest-green); }
        .ds-op-btn { border:0; padding:5px 7px; background:transparent; color:var(--forest-green); display:inline-flex; align-items:center; gap:5px; border-radius:4px; font-size:13px; font-family:inherit; cursor:pointer; }
        .ds-op-btn:hover { background:#edf8f2; }
        .ds-op-btn svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; }
        .ds-empty { padding:72px 20px; text-align:center; color:var(--text-tertiary, #919b96); }

        .ds-pagination { min-height:58px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-top:1px solid var(--border-divider, #ebeefd); }
        .ds-page-total { font-size:12px; color:var(--text-tertiary, #919b96); }
        .ds-page-list { display:flex; align-items:center; gap:6px; }
        .ds-page-btn { min-width:30px; height:30px; padding:0 9px; border:1px solid var(--border-default, #d1d9d6); border-radius:4px; background:#fff; color:var(--text-secondary, #5c6863); font-size:12px; cursor:pointer; }
        .ds-page-btn:hover:not(:disabled), .ds-page-btn.active { border-color:var(--forest-green); color:var(--forest-green); background:#edf8f2; }
        .ds-page-btn:disabled { color:#c5cbc8; cursor:not-allowed; }
        .ds-page-ellipsis { color:#a5ada9; font-size:12px; }

        .ds-drawer-mask { position:fixed; top:64px; left:180px; right:0; bottom:0; z-index:260; background:rgba(15,23,42,.2); opacity:0; pointer-events:none; transition:opacity .2s; }
        .ds-drawer-mask.show { opacity:1; pointer-events:auto; }
        .ds-drawer { position:absolute; top:8px; right:8px; bottom:8px; width:min(980px, calc(100vw - 220px)); display:flex; flex-direction:column; overflow:hidden; background:#fff; border-radius:8px; box-shadow:-8px 0 32px rgba(15,23,42,.18); transform:translateX(calc(100% + 18px)); transition:transform .24s; }
        .ds-drawer-mask.show .ds-drawer { transform:translateX(0); }
        .ds-drawer-head { flex:none; min-height:62px; padding:0 22px; border-bottom:1px solid var(--border-divider, #ebeefd); display:flex; align-items:center; gap:12px; }
        .ds-drawer-close { width:28px; height:28px; padding:0; border:0; border-radius:4px; background:transparent; color:#909399; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .ds-drawer-close:hover { color:#303133; background:#f5f7fa; }
        .ds-drawer-close svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; }
        .ds-drawer-heading { min-width:0; flex:1; }
        .ds-drawer-title { font-size:16px; line-height:24px; font-weight:700; color:var(--text-primary, #1f2b28); }
        .ds-drawer-meta { margin-top:2px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-tertiary, #919b96); }
        .ds-meta-dot { width:3px; height:3px; border-radius:50%; background:#b8c0bc; }
        .ds-drawer-body { flex:1; min-height:0; overflow:auto; padding:20px 22px 28px; background:#f6f8f7; }
        .ds-drawer-foot { flex:none; height:64px; padding:0 22px; border-top:1px solid var(--border-divider, #ebeefd); display:flex; align-items:center; justify-content:flex-end; gap:10px; background:#fff; }

        .ds-edit-section { margin-bottom:16px; background:#fff; border:1px solid var(--border-divider, #ebeefd); border-radius:6px; overflow:hidden; }
        .ds-edit-section:last-child { margin-bottom:0; }
        .ds-section-head { min-height:46px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--border-divider, #ebeefd); }
        .ds-section-head h3 { margin:0; padding-left:9px; border-left:3px solid var(--forest-green); font-size:14px; color:var(--text-primary, #1f2b28); }
        .ds-section-head span { font-size:12px; color:var(--text-tertiary, #919b96); }
        .ds-section-body { padding:16px; }
        .ds-preview-shell { min-height:230px; padding:18px; box-sizing:border-box; border-radius:6px; background:#f5fbf8; border:1px solid #cfe5d9; }
        .ds-cockpit-panel { width:100%; }
        .ds-preview-head { min-height:32px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
        .ds-preview-title { margin:0; color:#204b36; font-size:16px; font-weight:700; }
        .ds-preview-subtitle { padding:3px 9px; border-radius:3px; background:#dff1e7; color:#278050; font-size:12px; }
        .ds-preview-chart { position:relative; width:100%; height:270px; }
        .ds-preview-chart canvas { width:100% !important; height:100% !important; }
        .ds-radar-chart { max-width:640px; height:330px; margin:0 auto; }
        .ds-radar-kpi { justify-content:flex-end; margin:-4px 8px 0 0; }
        .ds-radar-center { position:absolute; left:50%; top:50%; z-index:1; min-width:104px; padding:9px 12px; border:1px solid rgba(32,113,70,.12); border-radius:50%; background:rgba(247,252,249,.9); color:#5b6e60; text-align:center; pointer-events:none; transform:translate(-50%,-47%); box-shadow:0 4px 16px rgba(32,113,70,.06); }
        .ds-radar-center span { display:block; font-size:12px; line-height:18px; }
        .ds-radar-center strong { display:inline-block; margin-top:1px; color:#168b52; font-size:27px; line-height:32px; font-family:'Inter','Noto Sans SC',sans-serif; }
        .ds-radar-center em { margin-left:3px; color:#52705f; font-size:12px; font-style:normal; }
        .ds-preview-fallback, .ds-preview-note { color:#7b8982; font-size:12px; line-height:1.7; }
        .ds-preview-note { margin:12px 0 0; }
        .ds-metric-card { width:min(500px, 100%); box-sizing:border-box; padding:22px; border-radius:6px; background:#fff; border:1px solid #cfe5d9; color:#204b36; }
        .ds-metric-card.gold { border-color:#ecd8ad; }
        .ds-metric-card.blue { border-color:#cbdff1; }
        .ds-metric-label { font-size:14px; color:#52655a; margin-bottom:8px; }
        .ds-metric-value-line { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
        .ds-metric-value { font-family:'Inter','Noto Sans SC',sans-serif; font-size:34px; line-height:42px; font-weight:700; }
        .gold .ds-metric-value { color:#a56a0c; }
        .blue .ds-metric-value { color:#2f7fcb; }
        .ds-metric-unit { font-size:14px; color:#52655a; }
        .ds-metric-trend { margin-top:12px; display:flex; align-items:center; gap:6px; color:#278050; font-size:13px; }
        .ds-metric-trend.down { color:#c06043; }
        .ds-metric-details { display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:14px; padding-top:12px; border-top:1px solid #e4eee8; font-size:13px; color:#52655a; }
        .ds-metric-details strong { margin-left:8px; color:#207146; }
        .ds-trend-marker { margin-left:3px; color:#207146; font-style:normal; font-weight:700; }
        .ds-trend-marker.down { color:#c06043; }

        .ds-form-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 18px; }
        .ds-form-item { min-width:0; }
        .ds-form-item.full { grid-column:1 / -1; }
        .ds-form-label { display:block; margin-bottom:7px; color:var(--text-secondary, #5c6863); font-size:13px; }
        .ds-form-label.required::before { content:"*"; margin-right:4px; color:#f56c6c; }
        .ds-form-control { width:100%; height:36px; box-sizing:border-box; padding:0 11px; border:1px solid var(--border-default, #d1d9d6); border-radius:4px; color:var(--text-primary, #1f2b28); font-size:13px; font-family:inherit; outline:none; }
        .ds-form-control:focus { border-color:var(--forest-green); box-shadow:0 0 0 2px rgba(32,165,101,.08); }
        .ds-form-control[readonly] { background:#f7f9f8; color:#7e8984; }

        .ds-data-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:12px; }
        .ds-data-hint { font-size:12px; color:var(--text-tertiary, #919b96); }
        .ds-excel-actions { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; }
        .ds-excel-actions .ds-btn { height:30px; padding:0 10px; font-size:12px; }
        .ds-excel-actions .ds-btn:disabled { border-color:#e2e6e4; background:#f5f7f6; color:#b8bfbc; cursor:not-allowed; }
        .ds-import-input { display:none; }
        .ds-edit-table-wrap { width:100%; max-height:360px; overflow:auto; border:1px solid #cfd6d2; border-radius:4px; background:#fff; }
        .ds-edit-table { width:100%; min-width:680px; border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:12px; }
        .ds-edit-table th { position:sticky; top:0; z-index:2; height:46px; padding:4px 9px; background:#eef1ef; color:var(--text-secondary, #5c6863); font-weight:600; text-align:left; border-right:1px solid #cfd6d2; border-bottom:1px solid #cfd6d2; white-space:nowrap; }
        .ds-edit-table td { height:36px; padding:0; background:#fff; border-right:1px solid #dfe4e1; border-bottom:1px solid #dfe4e1; }
        .ds-edit-table tr:last-child td { border-bottom:0; }
        .ds-edit-table th:last-child, .ds-edit-table td:last-child { border-right:0; }
        .ds-row-index { position:sticky; left:0; z-index:1; width:42px; min-width:42px; background:#f3f5f4 !important; color:#7b8581; text-align:center; font-family:'Inter',sans-serif; }
        .ds-edit-table th.ds-row-index { z-index:3; }
        .ds-column-letter { display:block; margin-bottom:2px; color:#939c98; font:10px/12px 'Inter',sans-serif; }
        .ds-column-name { display:block; overflow:hidden; text-overflow:ellipsis; }
        .ds-cell-input { width:100%; min-width:108px; height:36px; box-sizing:border-box; padding:0 8px; border:2px solid transparent; border-radius:0; background:transparent; color:var(--text-primary, #1f2b28); font-size:13px; font-family:inherit; outline:none; }
        .ds-cell-input:hover { background:#f8fbf9; }
        .ds-cell-input:focus { position:relative; z-index:1; border-color:var(--forest-green); background:#fff; box-shadow:inset 0 0 0 1px var(--forest-green); }
        .ds-cell-input.selected { background:#e8f5e9; box-shadow:inset 0 0 0 1px rgba(32,165,101,.44); }
        .ds-cell-input.selected:focus { border-color:var(--forest-green); box-shadow:inset 0 0 0 1px var(--forest-green); }
        .ds-excel-tip { display:flex; align-items:center; gap:6px; color:#7c8782; font-size:12px; }
        .ds-excel-tip kbd { padding:1px 5px; border:1px solid #d4dad7; border-bottom-width:2px; border-radius:3px; background:#fff; color:#52605a; font:11px 'Inter',sans-serif; }

        .ds-rank-preview { display:flex; flex-direction:column; gap:8px; }
        .ds-rank-row { display:grid; grid-template-columns:26px minmax(0,1fr) minmax(60px,130px) 110px; gap:10px; align-items:center; padding:8px 10px; border:1px solid #e2eee6; border-radius:4px; background:#fff; }
        .ds-rank-index { width:24px; height:24px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff; background:#278050; font-size:12px; }
        .ds-rank-row:nth-child(-n+3) .ds-rank-index { background:#d89923; }
        .ds-rank-name { color:#3d5446; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ds-rank-value { color:#207146; text-align:right; font-size:13px; font-variant-numeric:tabular-nums; }
        .ds-rank-track { height:5px; border-radius:3px; background:#eaf3ed; overflow:hidden; }
        .ds-rank-fill { height:100%; border-radius:3px; background:#278050; }
        .ds-stat-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .ds-stat-card { padding:16px; background:#fff; border:1px solid #dcebe2; border-radius:6px; }
        .ds-stat-card h4 { margin:0 0 12px; color:#355741; font-size:14px; }
        .ds-stat-card p { margin:8px 0 0; color:#617367; font-size:13px; }
        .ds-stat-card strong { color:#207146; font-size:20px; margin-right:5px; }
        .ds-distribution-bar { display:flex; height:30px; border-radius:4px; overflow:hidden; margin:20px 0; background:#e8eee9; }
        .ds-distribution-bar span { min-width:0; }
        .ds-distribution-legend { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; font-size:13px; color:#46614f; }
        .ds-color-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
        .ds-inline-stats { display:flex; flex-wrap:wrap; gap:12px 24px; margin-bottom:16px; color:#5b6e60; font-size:13px; }
        .ds-inline-stats strong { color:#207146; font-size:18px; margin:0 5px; }
        .ds-case-preview { max-width:560px; display:grid; grid-template-columns:200px minmax(0,1fr); gap:18px; align-items:center; background:#fff; border:1px solid #dcebe2; border-radius:6px; padding:16px; }
        .ds-case-image { display:block; width:100%; aspect-ratio:16/9; border:1px solid #dcebe2; border-radius:4px; background-repeat:no-repeat; background-color:#eef5f1; }
        img.ds-case-image { box-sizing:border-box; object-fit:cover; }
        .ds-case-preview h4 { margin:0 0 10px; font-size:16px; color:#355741; overflow-wrap:anywhere; }
        .ds-case-preview p { margin:8px 0; font-size:13px; color:#617367; overflow-wrap:anywhere; }
        .ds-case-preview strong { font-size:24px; color:#207146; }
        .ds-definition-item { padding:12px 0; border-bottom:1px solid #e1ece5; font-size:13px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; color:#52655a; }
        .ds-definition-item:last-child { border-bottom:0; }
        .ds-definition-item strong { color:#207146; }
        .ds-case-preview-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .ds-case-preview-list .ds-case-preview { max-width:none; grid-template-columns:130px minmax(0,1fr); gap:14px; padding:12px; }
        .ds-case-preview-list .ds-case-preview strong { font-size:20px; }
        .ds-collection-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; }
        .ds-collection-count { color:#69766f; font-size:12px; }
        .ds-collection-list { display:flex; flex-direction:column; gap:12px; }
        .ds-collection-card { padding:14px; border:1px solid #dfe8e3; border-radius:6px; background:#fbfdfc; }
        .ds-collection-card-head { min-height:30px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .ds-collection-card-head h4 { margin:0; color:#355741; font-size:14px; }
        .ds-collection-card-head .ds-btn { height:30px; padding:0 10px; font-size:12px; }
        .ds-collection-card-head .ds-btn:disabled, .ds-collection-toolbar .ds-btn:disabled { border-color:#e2e6e4; background:#f5f7f6; color:#b8bfbc; cursor:not-allowed; }
        .ds-field-unit { display:flex; align-items:center; gap:8px; }
        .ds-field-unit span { flex:none; color:#7d8881; font-size:13px; }
        textarea.ds-form-control { height:90px; min-height:72px; resize:vertical; line-height:1.7; padding:9px 11px; }
        .ds-cover-picker { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }

        function metric(name, value, trend, options) {

                    value:value, unit:config.unit || '', tone:config.tone || 'green',

                    direction:'up', compareText:config.compareText || '环比', details:config.details || []
                }

        }

        function series(label, data, options) {
            var result = Object.assign({ label:label, data:data }, options || {});
            var countUnit = /[（(](个|家|项)[）)]/.exec(label);
            if (!result.valueUnit && countUnit) result.valueUnit = countUnit[1];
            return result;
        }

        function chart(name, chartType, labels, datasets, options) {
            var config = options || {};

                type:'dashboard', name:name, section:config.section || '图表分析',
                data:Object.assign({
                    previewType:'chart', chartType:chartType, labels:labels, datasets:datasets,
                    extras:[], note:''
                }, config)
            };

        function ranking(name, labels, values, valueLabel, options) {
            return chart(name, 'ranking', labels, [series(valueLabel, values)],

        function field(label, value, unit, options) {

                    control = '<div class="ds-field-unit"><input class="ds-form-control" type="' + (item.kind === 'number' ? 'number' : 'text') + '"' +

                        attrs + ' value="' + escapeHtml(item.value) + '">' + (item.unit ? '<span>' + escapeHtml(item.unit) + '</span>' : '') + '</div>';
                }
                var trendControl = Object.prototype.hasOwnProperty.call(item, 'trendDirection') ?
                    '<div class="ds-form-item"><label class="ds-form-label" for="' + id + '-trend">趋势标识</label><select id="' + id + '-trend" class="ds-form-control" data-field-trend-group="' + group + '" data-field-index="' + index + '">' +
                    [['none','不展示'],['up','上升'],['down','下降']].map(function (option) { return '<option value="' + option[0] + '"' + (item.trendDirection === option[0] ? ' selected' : '') + '>' + option[1] + '</option>'; }).join('') + '</select></div>' : '';
                return nameControl + '<div class="ds-form-item' + (item.kind === 'image' || item.kind === 'textarea' ? ' full' : '') + '">' + label + control + '</div>' + trendControl;
            }).join('');

        function fieldsPreview(fields) {

        function caseImageHtml(item) {

            var positionX = crop.sourceWidth === crop.width ? 50 : crop.x / (crop.sourceWidth - crop.width) * 100;
            var positionY = crop.sourceHeight === crop.height ? 50 : crop.y / (crop.sourceHeight - crop.height) * 100;
            return '<span class="ds-case-image" role="img" aria-label="' + escapeHtml(item.name) + '" style="aspect-ratio:' + crop.width + '/' + crop.height + ';background-image:url(&quot;' + escapeHtml(item.image) + '&quot;);background-size:' + sizeX + '% ' + sizeY + '%;background-position:' + positionX + '% ' + positionY + '%"></span>';

        function definitionCardsHtml(items) {

                    '<button class="ds-btn" type="button" data-collection-action="remove" data-item-index="' + index + '"' + (items.length <= 1 ? ' disabled' : '') +
                    '><svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="m7 7 1 13h8l1-13"></path></svg><span>删除</span></button></div>' +
                    '<div class="ds-form-grid"><div class="ds-form-item full"><label class="ds-form-label required">指标名称</label><input class="ds-form-control" maxlength="60" data-definition-field="name" data-item-index="' + index + '" value="' + escapeHtml(item.name) + '"></div>' +

        function renderStructuredEditor() {

        function filteredRecords() {
            var keyword = filters.name.trim().toLowerCase();
            return records.filter(function (record) {
                if (record.screen !== activeScreen) return false;
                var fieldNames = (record.data.fields || record.data.details || []).map(function (item) { return item.label; });
                var itemNames = (record.data.items || []).map(function (item) {
                    return [item.name, item.description, item.effectName].join(' ');
                });
                var searchText = [record.name, record.section, record.data.subtitle || ''].concat(fieldNames, record.data.labels || [],
                    (record.data.datasets || []).map(function (item) { return item.label; }),
                    (record.data.extras || []).map(function (item) { return item.label; }), itemNames).join(' ').toLowerCase();
                if (keyword && searchText.indexOf(keyword) < 0) return false;
                if (filters.year && String(record.year) !== filters.year) return false;
                if (filters.status === 'enabled' && !record.enabled) return false;
                if (filters.status === 'disabled' && record.enabled) return false;
                return true;
            });
        }

        function pageTokens(totalPages, page) {
            if (totalPages <= 7) return Array.from({ length: totalPages }, function (_, index) { return index + 1; });
            var tokens = [1];
            var start = Math.max(2, page - 1);
            var end = Math.min(totalPages - 1, page + 1);
            if (start > 2) tokens.push('ellipsis-left');
            for (var i = start; i <= end; i++) tokens.push(i);
            if (end < totalPages - 1) tokens.push('ellipsis-right');
            tokens.push(totalPages);
            return tokens;
        }

        function renderPagination(total) {
            var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            var html = '<button class="ds-page-btn" data-page="' + (currentPage - 1) + '" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';
            pageTokens(totalPages, currentPage).forEach(function (token) {
                if (typeof token === 'string') html += '<span class="ds-page-ellipsis">…</span>';
                else html += '<button class="ds-page-btn ' + (token === currentPage ? 'active' : '') + '" data-page="' + token + '">' + token + '</button>';
            });
            html += '<button class="ds-page-btn" data-page="' + (currentPage + 1) + '" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
            pageList.innerHTML = html;
            pageTotal.textContent = '共 ' + total + ' 条，第 ' + currentPage + ' / ' + totalPages + ' 页';
        }

        function renderTable() {
            var list = filteredRecords();
            currentPage = Math.min(currentPage, Math.max(1, Math.ceil(list.length / PAGE_SIZE)));
            var start = (currentPage - 1) * PAGE_SIZE;
            var pageRows = list.slice(start, start + PAGE_SIZE);
            resultSummary.textContent = activeScreen + ' · 共 ' + list.length + ' 条数据';
            if (!pageRows.length) {
                body.innerHTML = '<tr><td colspan="6"><div class="ds-empty">暂无符合条件的数据</div></td></tr>';
                renderPagination(list.length);
                return;
            }
            body.innerHTML = pageRows.map(function (record) {
                var typeText = typeLabel(record);
                return [
                    '<tr data-record-id="' + record.id + '">',
                    '  <td><div class="ds-name-cell"><div class="ds-name-main"><span class="ds-name-text" title="' + escapeHtml(record.name) + '">' + escapeHtml(record.name) + '</span></div><div class="ds-record-note">' + escapeHtml(record.section) + '</div></div></td>',
                    '  <td><span class="ds-type-text">' + typeText + '</span></td>',
                    '  <td><span class="ds-screen-tag">' + escapeHtml(record.screen) + '</span></td>',
                    '  <td><span class="ds-year">' + record.year + '年度</span></td>',
                    '  <td><div class="ds-status"><button type="button" class="ds-switch ' + (record.enabled ? 'on' : '') + '" data-action="toggle" aria-pressed="' + record.enabled + '" aria-label="切换状态"></button><span class="ds-status-text">' + (record.enabled ? '启用' : '未启用') + '</span></div></td>',
                    '  <td><button type="button" class="ds-op-btn" data-action="edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path></svg><span>编辑</span></button></td>',
                    '</tr>'
                ].join('');
            }).join('');
            renderPagination(list.length);
        }

        function showToast(message, type) {
            var toast = document.getElementById('dsToast');
            toast.textContent = message;
            toast.className = 'ds-toast show' + (type === 'error' ? ' error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.className = 'ds-toast'; }, 2200);

            filters.name = document.getElementById('dsNameFilter').value;

                '<span>' + escapeHtml(record.screen) + '</span>',

                '<span>' + typeLabel(record) + '</span>'
            ].join('');

        function metricPreviewHtml() {
            var data = editDraft.data;
            var trend = data.trendMode === 'none' ? '' : '<div class="ds-metric-trend' + (data.direction === 'down' ? ' down' : '') + '">' +
                escapeHtml(data.compareText) + ' ' + (data.direction === 'down' ? '↓ ' : '↑ ') +
                formatNumber(data.trend) + escapeHtml(data.trendMode === 'percent' ? '%' : data.trendUnit) + '</div>';
            var extras = data.details.length ? '<div class="ds-metric-details">' + data.details.map(function (item) {
                var marker = item.trendDirection && item.trendDirection !== 'none' ? '<em class="ds-trend-marker' + (item.trendDirection === 'down' ? ' down' : '') + '">' + (item.trendDirection === 'down' ? '↓' : '↑') + '</em>' : '';
                return '<span>' + escapeHtml(item.label) + '<strong>' + formatNumber(item.value) + '</strong>' + marker + ' ' + escapeHtml(item.unit) + '</span>';
            }).join('') + '</div>' : '';
            return '<div class="ds-preview-shell"><div class="ds-metric-card ' + data.tone + '"><div class="ds-metric-label">' +

                '</span><span class="ds-metric-unit">' + escapeHtml(data.unit) + '</span></div>' + trend + extras + '</div></div>';

        function renderMetricEditor() {
            var data = editDraft.data;
            var hidden = data.trendMode === 'none' ? ' hidden' : '';
            drawerBody.innerHTML = '<section class="ds-edit-section"><div class="ds-section-head"><h3>指标预览</h3><span>V2 浅色指标卡示意</span></div>' +
                '<div class="ds-section-body" id="dsPreviewArea">' + metricPreviewHtml() + '</div></section>' +
                '<section class="ds-edit-section"><div class="ds-section-head"><h3>指标数据</h3><span>编辑仅影响本页预览</span></div><div class="ds-section-body"><div class="ds-form-grid">' +
                moduleNameControlHtml() +
                '<div class="ds-form-item"><label class="ds-form-label required" for="dsMetricValue">指标值</label><input id="dsMetricValue" class="ds-form-control" type="number" min="0" step="any" data-metric-field="value" value="' + escapeHtml(data.value) + '"></div>' +
                '<div class="ds-form-item"><label class="ds-form-label required" for="dsMetricUnit">单位</label><input id="dsMetricUnit" class="ds-form-control" maxlength="12" data-metric-field="unit" value="' + escapeHtml(data.unit) + '"></div>' +

                '<div class="ds-form-item"' + hidden + '><label class="ds-form-label" for="dsTrendDirection">变化方向</label><select id="dsTrendDirection" class="ds-form-control" data-metric-field="direction"><option value="up"' + (data.direction === 'up' ? ' selected' : '') + '>上升</option><option value="down"' + (data.direction === 'down' ? ' selected' : '') + '>下降</option></select></div>' +
                '<div class="ds-form-item"' + hidden + '><label class="ds-form-label required" for="dsCompareText">比较口径</label><input id="dsCompareText" class="ds-form-control" maxlength="20" data-metric-field="compareText" value="' + escapeHtml(data.compareText) + '" placeholder="如：环比、本月"></div>' +

                fieldControls(data.details, 'details') + '</div></div></section>';

        function chartColors(index, alpha) {
            var colors = [[30,139,75],[237,145,22],[30,122,212],[40,162,169],[142,189,56],[211,101,66]];
            return 'rgba(' + colors[index % colors.length].join(',') + ',' + (alpha == null ? 1 : alpha) + ')';
        }

        function destroyPreviewChart() {
            if (previewChart) { previewChart.destroy(); previewChart = null; }
        }

        function chartStatsHtml(data) {
            var fields = data.extras || [];
            var html = fields.length ? '<div class="ds-inline-stats">' + fields.map(function (item) {
                return '<span>' + escapeHtml(item.label) + '<strong>' + formatNumber(item.value) + '</strong>' + escapeHtml(item.unit) + '</span>';
            }).join('') + '</div>' : '';
            if (data.showTotal) {
                var total = data.datasets[0].data.reduce(function (sum, value) { return sum + (Number(value) || 0); }, 0);
                html += '<div class="ds-inline-stats"><span>登记总数<strong>' + formatNumber(total) + '</strong>项</span>' +
                    data.labels.map(function (label, index) {
                        return '<span>' + escapeHtml(label) + ' ' + (total ? Math.round((Number(data.datasets[0].data[index]) || 0) / total * 100) : 0) + '%</span>';
                    }).join('') + '</div>';
            }
            return html;
        }

        function radarSummaryHtml(data) {
            var timely = (data.extras || []).find(function (item) { return item.key === 'update-timeliness'; });
            return timely ? '<div class="ds-inline-stats ds-radar-kpi"><span>' + escapeHtml(timely.label) + '<strong>' + formatNumber(timely.value) + '</strong>' + escapeHtml(timely.unit) + '</span></div>' : '';
        }

        function radarCenterHtml(data) {
            var summary = (data.extras || []).find(function (item) { return item.key === 'overall-score'; });
            return summary ? '<div class="ds-radar-center"><span>' + escapeHtml(summary.label) + '</span><strong>' + formatNumber(summary.value) + '</strong><em>' + escapeHtml(summary.unit) + '</em></div>' : '';
        }

        function renderChartPreview() {
            destroyPreviewChart();
            var area = document.getElementById('dsPreviewArea');
            if (!area || !editDraft || editDraft.type !== 'dashboard') return;
            var data = editDraft.data;
            var circle = data.chartType === 'doughnut' || data.chartType === 'pie';
            var radar = data.chartType === 'radar';
            var head = '<div class="ds-preview-head"><h4 class="ds-preview-title">' + escapeHtml(editDraft.name) + '</h4>' +
                (data.subtitle ? '<span class="ds-preview-subtitle">' + escapeHtml(data.subtitle) + '</span>' : '') + '</div>';
            var note = data.note ? '<p class="ds-preview-note">' + escapeHtml(data.note) + '</p>' : '';
            var content = '';
            if (data.previewType === 'ranking') {
                var rows = data.labels.map(function (label, index) { return { label:label, value:Number(data.datasets[0].data[index]) || 0 }; })
                    .sort(function (a, b) { return b.value - a.value; }).slice(0, data.topLimit || 10);
                var max = Math.max(1, rows.length ? rows[0].value : 1);
                content = (data.subtitle ? '' : '<p class="ds-preview-note">按' + escapeHtml(data.datasets[0].label) + '降序显示 TOP' + (data.topLimit || 10) + '</p>') + '<div class="ds-rank-preview">' +
                    rows.map(function (row, index) {
                        return '<div class="ds-rank-row"><span class="ds-rank-index">' + (index + 1) + '</span><span class="ds-rank-name" title="' +
                            escapeHtml(row.label) + '">' + escapeHtml(row.label) + '</span><div class="ds-rank-track"><div class="ds-rank-fill" style="width:' +
                            Math.max(0, row.value / max * 100) + '%"></div></div><span class="ds-rank-value">' + formatNumber(row.value) + '</span></div>';
                    }).join('') + '</div>';
            } else if (data.previewType === 'distribution') {
                content = '<div class="ds-distribution-bar">' + data.labels.map(function (_, index) {
                    var width = Math.max(0, Math.min(100, Number(data.datasets[0].data[index]) || 0));
                    return '<span style="width:' + width + '%;background:' + chartColors(index) + '"></span>';
                }).join('') + '</div><div class="ds-distribution-legend">' + data.labels.map(function (label, index) {
                    return '<span><i class="ds-color-dot" style="background:' + chartColors(index) + '"></i>' + escapeHtml(label) + ' ' +
                        formatNumber(data.datasets[0].data[index]) + '%</span>';
                }).join('') + '</div>';
            } else if (data.previewType === 'spaces') {
                content = '<div class="ds-stat-grid">' + data.labels.map(function (label, index) {
                    return '<div class="ds-stat-card"><h4>' + escapeHtml(label) + '</h4><strong>' + formatNumber(data.datasets[0].data[index]) +
                        '</strong><span>个数据集</span><p>数据量 <strong>' + formatNumber(data.datasets[1].data[index]) + '</strong>TB</p></div>';
                }).join('') + '</div>';
            }
            if (content) {
                area.innerHTML = '<div class="ds-preview-shell">' + head + content + note + '</div>';
                return;
            }
            area.innerHTML = '<div class="ds-preview-shell">' + head + (radar ? radarSummaryHtml(data) : chartStatsHtml(data)) +
                '<div class="ds-preview-chart' + (radar ? ' ds-radar-chart' : '') + '"><canvas id="dsPreviewCanvas"></canvas>' + (radar ? radarCenterHtml(data) : '') + '</div>' + note + '</div>';
            if (!window.Chart) {
                area.innerHTML = '<div class="ds-preview-shell">' + head + chartStatsHtml(data) +
                    '<p class="ds-preview-fallback">图表组件暂未加载，仍可在下方维护和保存数据。</p>' + note + '</div>';
                return;
            }
            var datasets = data.datasets.map(function (dataset, index) {
                var result = {
                    label:dataset.label, data:dataset.data.map(function (value) {
                        return value === '' || !Number.isFinite(Number(value)) ? null : Number(value);
                    }),
                    borderColor:chartColors(index), borderWidth:2,
                    backgroundColor:circle ? data.labels.map(function (_, i) { return chartColors(i, .85); }) : chartColors(index, .12),
                    fill:radar || (data.chartType === 'line' && index === 0),
                    tension:.3, pointRadius:3, borderRadius:data.chartType === 'bar' ? 4 : 0
                };

                }

                if (dataset.yAxisID) result.yAxisID = dataset.yAxisID;
                if (dataset.dashed) result.borderDash = [5,4];
                return result;
            });
            var options = {
                responsive:true, maintainAspectRatio:false,
                plugins:{
                    legend:{ position:'bottom', labels:{ color:'#536c5d', boxWidth:10, font:{ size:12 }, padding:16 } },
                    tooltip:{ backgroundColor:'#fff', borderColor:'#cfe5d9', borderWidth:1, titleColor:'#204b36', bodyColor:'#536c5d' }
                },

                options.plugins.legend.display = false;
                options.layout = { padding:{ top:18, right:38, bottom:18, left:38 } };

                    ticks:{ display:false, stepSize:20 },
                    pointLabels:{ color:'#355741', padding:18, font:{ size:13, weight:'600' }, callback:function (label, index) {
                        return [label, formatNumber(data.datasets[0].data[index])];
                    } },
                    grid:{ color:'rgba(43,138,82,.16)', lineWidth:1 },
                    angleLines:{ color:'rgba(43,138,82,.14)', lineWidth:1 }
                } };
            } else if (!circle) {
                options.indexAxis = data.indexAxis || 'x';
                options.scales = {
                    x:{ beginAtZero:true, grid:{ color:'#e7f0ea' }, ticks:{ color:'#6c8173', font:{ size:12 } } },
                    y:{ beginAtZero:true, grid:{ color:'#e7f0ea' }, ticks:{ color:'#6c8173', font:{ size:12 } } }
                };
                if (data.dualAxis) options.scales.y1 = { position:'right', beginAtZero:true, grid:{ drawOnChartArea:false }, ticks:{ color:'#b47c26', font:{ size:12 } } };
            } else if (data.chartType === 'doughnut') options.cutout = '65%';

        function excelColumnName(index) {
            var name = '';
            var value = index + 1;
            while (value > 0) {
                value -= 1;
                name = String.fromCharCode(65 + (value % 26)) + name;
                value = Math.floor(value / 26);
            }
            return name;
        }

        function normalizedSelection() {
            if (!selectionRange) return null;
            return {
                startRow:Math.min(selectionRange.startRow, selectionRange.endRow),
                endRow:Math.max(selectionRange.startRow, selectionRange.endRow),
                startCol:Math.min(selectionRange.startCol, selectionRange.endCol),
                endCol:Math.max(selectionRange.startCol, selectionRange.endCol)
            };
        }

        function isSelectedCell(row, col) {
            var range = normalizedSelection();
            return range && row >= range.startRow && row <= range.endRow && col >= range.startCol && col <= range.endCol;
        }

        function resetDashboardHistory() {
            clearTimeout(historyTimer);
            historyTimer = null;
            dashboardHistory = editDraft && editDraft.type === 'dashboard' ? [clone(editDraft.data)] : [];
            dashboardHistoryIndex = dashboardHistory.length ? 0 : -1;
        }

        function commitDashboardHistory() {
            if (!editDraft || editDraft.type !== 'dashboard') return;
            var snapshot = clone(editDraft.data);
            var current = dashboardHistory[dashboardHistoryIndex];
            if (current && JSON.stringify(current) === JSON.stringify(snapshot)) {
                updateExcelToolbar();
                return;
            }
            dashboardHistory = dashboardHistory.slice(0, dashboardHistoryIndex + 1);
            dashboardHistory.push(snapshot);
            if (dashboardHistory.length > 50) dashboardHistory.shift();
            dashboardHistoryIndex = dashboardHistory.length - 1;
            updateExcelToolbar();
        }

        function scheduleDashboardHistory() {
            clearTimeout(historyTimer);
            historyTimer = setTimeout(function () {
                historyTimer = null;
                commitDashboardHistory();
            }, 320);
        }

        function flushDashboardHistory() {
            if (!historyTimer) return;
            clearTimeout(historyTimer);
            historyTimer = null;
            commitDashboardHistory();
        }

        function clampSelectionToData() {
            if (!selectionRange || !editDraft || !editDraft.data.labels.length) return;
            var maxRow = editDraft.data.labels.length - 1;
            var maxCol = editDraft.data.datasets.length;
            selectionRange.startRow = Math.min(selectionRange.startRow, maxRow);
            selectionRange.endRow = Math.min(selectionRange.endRow, maxRow);
            selectionRange.startCol = Math.min(selectionRange.startCol, maxCol);
            selectionRange.endCol = Math.min(selectionRange.endCol, maxCol);
            selectionAnchor = { row:selectionRange.startRow, col:selectionRange.startCol };
        }

        function restoreDashboardHistory(message) {
            editDraft.data = clone(dashboardHistory[dashboardHistoryIndex]);
            clampSelectionToData();
            renderDashboardEditor();
            showToast(message);
        }

        function undoDashboard() {
            flushDashboardHistory();
            if (dashboardHistoryIndex <= 0) {
                updateExcelToolbar();
                return;
            }
            dashboardHistoryIndex -= 1;
            restoreDashboardHistory('已撤销上一步操作');
        }

        function redoDashboard() {
            flushDashboardHistory();
            if (dashboardHistoryIndex < 0 || dashboardHistoryIndex >= dashboardHistory.length - 1) {
                updateExcelToolbar();
                return;
            }
            dashboardHistoryIndex += 1;
            restoreDashboardHistory('已恢复下一步操作');
        }

        function clearSelectedCells() {
            var range = normalizedSelection();
            if (!range || !editDraft || editDraft.type !== 'dashboard') return;
            flushDashboardHistory();
            for (var row = range.startRow; row <= range.endRow; row++) {
                for (var col = range.startCol; col <= range.endCol; col++) {
                    if (col === 0) editDraft.data.labels[row] = '';
                    else editDraft.data.datasets[col - 1].data[row] = '';
                }
            }
            commitDashboardHistory();
            renderDashboardEditor();
            showToast('已删除选中的 ' + selectionCellCount() + ' 个单元格');
        }

        function selectedRangeText() {
            var range = normalizedSelection();
            if (!range || !editDraft || editDraft.type !== 'dashboard') return '';
            var rows = [];
            for (var row = range.startRow; row <= range.endRow; row++) {
                var cells = [];
                for (var col = range.startCol; col <= range.endCol; col++) {
                    var value = col === 0 ? editDraft.data.labels[row] : editDraft.data.datasets[col - 1].data[row];
                    cells.push(value == null ? '' : String(value));
                }
                rows.push(cells.join('\t'));
            }
            return rows.join('\n');
        }

        function numberError(value, label, unit, max) {
            if (value == null || String(value).trim() === '' || !Number.isFinite(Number(value)) || Number(value) < 0) return label + '请填写不小于 0 的有效数值';
            if (max != null && Number(value) > max) return label + '不能大于 ' + max;
            if (['个','家','项'].indexOf(unit) >= 0 && !Number.isInteger(Number(value))) return label + '请填写整数';
            return '';
        }

        function fieldsError(fields) {
            for (var i = 0; i < fields.length; i++) {
                var item = fields[i];
                if (!String(item.label || '').trim()) return '属性名称不能为空';
                if (item.kind === 'number') {
                    var error = numberError(item.value, item.label, item.unit, item.max);
                    if (error) return error;
                } else if (!String(item.value || '').trim()) return item.label + '不能为空';
            }
            return '';
        }

        function validateRecord(record) {
            var data = record.data;
            var error;
            if (!String(record.name || '').trim()) return '模块 / 指标名称不能为空';
            if (record.type === 'metric') {
                error = numberError(data.value, '指标值', data.unit);
                if (error) return error;
                if (!String(data.unit).trim()) return '请填写指标单位';
                if (data.trendMode !== 'none') {
                    error = numberError(data.trend, '变化数值', data.trendMode === 'count' ? data.trendUnit : '%');
                    if (error) return error;
                    if (!String(data.compareText).trim()) return '请填写比较口径';
                    if (data.trendMode === 'count' && !String(data.trendUnit).trim()) return '请填写变化单位';
                }
                error = fieldsError(data.details);
                if (error) return error;
                if (record.key === 'data-products-total' && Number(data.value) !== data.details.reduce(function (sum, item) { return sum + Number(item.value); }, 0)) {
                    return 'API接口数量与数据集数量之和应等于数据产品总量';
                }
                return '';
            }
            if (record.type === 'case-list') {
                if (!data.items.length || data.items.length > 10) return '优秀案例数量应为 1 至 10 条';
                for (var caseIndex = 0; caseIndex < data.items.length; caseIndex++) {
                    var caseItem = data.items[caseIndex];
                    if (!String(caseItem.name || '').trim()) return '案例 ' + (caseIndex + 1) + ' 名称不能为空';
                    if (!String(caseItem.image || '').trim()) return '案例 ' + (caseIndex + 1) + ' 图片不能为空';
                    if (!String(caseItem.effectName || '').trim()) return '案例 ' + (caseIndex + 1) + ' 成效名称不能为空';
                    error = numberError(caseItem.effectValue, '案例 ' + (caseIndex + 1) + ' 成效值', caseItem.unit);
                    if (error) return error;
                    if (!String(caseItem.unit || '').trim()) return '案例 ' + (caseIndex + 1) + ' 成效单位不能为空';
                }
                return '';
            }
            if (record.type === 'definition-list') {
                if (!data.items.length || data.items.length > 10) return '指标口径数量应为 1 至 10 条';
                for (var definitionIndex = 0; definitionIndex < data.items.length; definitionIndex++) {
                    var definition = data.items[definitionIndex];
                    if (!String(definition.name || '').trim()) return '口径 ' + (definitionIndex + 1) + ' 指标名称不能为空';
                    if (!String(definition.description || '').trim()) return '口径 ' + (definitionIndex + 1) + ' 说明不能为空';
                }
                return '';
            }
            if (record.type !== 'dashboard') return fieldsError(data.fields);
            if (Object.prototype.hasOwnProperty.call(data, 'subtitle') && !String(data.subtitle || '').trim()) return '分组 / 角标名称不能为空';
            if (!data.labels.length || data.labels.some(function (label) { return !String(label).trim(); })) return '维度 / 分类不能为空';
            for (var i = 0; i < data.datasets.length; i++) {
                var dataset = data.datasets[i];
                if (!String(dataset.label || '').trim()) return '数据系列名称不能为空';
                if (dataset.data.length !== data.labels.length) return '数据行数与分类数量不一致';
                for (var j = 0; j < dataset.data.length; j++) {
                    error = numberError(dataset.data[j], '第 ' + (j + 1) + ' 行「' + dataset.label + '」', dataset.valueUnit || '', data.percent ? 100 : data.max);
                    if (error) return error;
                }
            }
            if (data.percent) {
                var total = data.datasets[0].data.reduce(function (sum, value) { return sum + Number(value); }, 0);
                if (Math.abs(total - 100) > 0.01) return '各分类占比之和应为 100%，当前为 ' + formatNumber(total) + '%';
            }
            return fieldsError(data.extras);
        }

        function saveDrawer() {
            if (!editRecord || !editDraft) return;
            if (imageLoading || importLoading) { showToast('文件正在读取，请稍后保存', 'error'); return; }
            flushDashboardHistory();
            var error = validateRecord(editDraft);
            if (error) { showToast(error, 'error'); return; }
            editRecord.name = editDraft.name.trim();
            editRecord.data = clone(editDraft.data);
            var name = editRecord.name;
            closeDrawer();
            renderTable();
            showToast('已保存 ' + name + '，仅本页演示有效');
        }

        function parseCellNumber(value) {
            var text = String(value == null ? '' : value).replace(/,/g, '').trim();
            if (!text) return '';
            var numeric = Number(text);
            return Number.isFinite(numeric) ? numeric : text;
        }

        function parseCsvLine(line) {
            var result = [], current = '', quoted = false;
            for (var i = 0; i < line.length; i++) {
                var char = line[i];
                if (char === '"' && line[i + 1] === '"' && quoted) { current += '"'; i += 1; }
                else if (char === '"') quoted = !quoted;
                else if (char === ',' && !quoted) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }

        function clipboardRows(text) {
            var lines = String(text || '').replace(/\r/g, '').split('\n');
            if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
            return lines.map(function (line) { return line.split('\t'); });
        }

        function ensureDashboardRow(rowIndex) {
            while (editDraft.data.labels.length <= rowIndex) {
                editDraft.data.labels.push('');
                editDraft.data.datasets.forEach(function (dataset) { dataset.data.push(0); });
            }
        }

        function pasteDashboardCells(target, text) {
            var grid = clipboardRows(text);
            if (!grid.length || !grid[0].length) return;
            flushDashboardHistory();
            var selected = normalizedSelection();
            var startRow = selected ? selected.startRow : Number(target.getAttribute('data-row'));
            var startCol = selected ? selected.startCol : Number(target.getAttribute('data-col'));
            var maxCol = editDraft.data.datasets.length;
            var applied = 0;
            var endRow = startRow;
            var endCol = startCol;
            grid.forEach(function (sourceRow, rowOffset) {
                var targetRow = startRow + rowOffset;
                ensureDashboardRow(targetRow);
                sourceRow.forEach(function (cell, colOffset) {
                    var targetCol = startCol + colOffset;
                    if (targetCol > maxCol) return;
                    if (targetCol === 0) editDraft.data.labels[targetRow] = cell;
                    else editDraft.data.datasets[targetCol - 1].data[targetRow] = parseCellNumber(cell);
                    applied += 1;
                    endRow = Math.max(endRow, targetRow);
                    endCol = Math.max(endCol, targetCol);
                });
            });
            selectionRange = { startRow:startRow, startCol:startCol, endRow:endRow, endCol:endCol };
            selectionAnchor = { row:startRow, col:startCol };
            commitDashboardHistory();
            renderDashboardEditor();
            showToast('已批量粘贴 ' + applied + ' 个单元格');
        }

        function safeFilePart(value) {
            return String(value || '').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, '').slice(0, 50);
        }

        function downloadExcelTemplate() {
            if (!editDraft || editDraft.type !== 'dashboard') return;
            if (!window.XLSX) {
                showToast('Excel组件未加载，暂时无法下载模板', 'error');
                return;
            }
            try {
                var data = editDraft.data;
                var rows = [['维度 / 分类'].concat(data.datasets.map(function (dataset) { return dataset.label || '数值'; }))];
                data.labels.forEach(function (label, rowIndex) {
                    rows.push([label].concat(data.datasets.map(function (dataset) {
                        return dataset.data[rowIndex] == null ? '' : dataset.data[rowIndex];
                    })));
                });
                var dataSheet = XLSX.utils.aoa_to_sheet(rows);
                dataSheet['!cols'] = [{ wch:26 }].concat(data.datasets.map(function (dataset) {
                    return { wch:Math.min(34, Math.max(16, String(dataset.label || '数值').length * 2)) };
                }));
                var instructionSheet = XLSX.utils.aoa_to_sheet([
                    ['填写说明'],
                    ['1. 第一行为字段名称，请勿删除或修改列顺序。'],
                    ['2. 第一列填写维度 / 分类，其余列填写对应数据系列的数值。'],
                    ['3. 可以增加或删除数据行，不要新增或删除数据系列列。'],
                    ['4. 填写完成后，可直接通过“导入表格”上传本文件。']
                ]);
                instructionSheet['!cols'] = [{ wch:72 }];
                var workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, dataSheet, '数据维护模板');
                XLSX.utils.book_append_sheet(workbook, instructionSheet, '填写说明');
                var fileName = [safeFilePart(editDraft.screen), safeFilePart(editDraft.name), editDraft.year + '年度', '数据维护模板'].join('-') + '.xlsx';
                XLSX.writeFile(workbook, fileName);
                showToast('Excel模板已生成，包含对应格式和示例数据');
            } catch (error) {
                showToast('Excel模板生成失败', 'error');
            }
        }

        function csvRows(file) {
            return file.text().then(function (text) {
                return text.split(/\r?\n/).filter(function (line) { return line.trim(); }).map(parseCsvLine);
            });
        }

        function workbookRows(file) {
            if (!window.XLSX) {
                if (/\.csv$/i.test(file.name)) return csvRows(file);
                return Promise.reject(new Error('表格解析组件未加载，请改用 CSV 文件'));
            }
            return file.arrayBuffer().then(function (buffer) {
                var workbook = XLSX.read(buffer, { type:'array' });
                var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                return XLSX.utils.sheet_to_json(firstSheet, { header:1, raw:true, defval:'' });
            });
        }

        function applyImportedRows(rows) {
            var validRows = rows.filter(function (row) { return row && row.some(function (cell) { return String(cell == null ? '' : cell).trim() !== ''; }); });
            if (validRows.length < 2) throw new Error('表格至少需要一行表头和一行数据');
            var expected = ['维度 / 分类'].concat(editDraft.data.datasets.map(function (dataset) { return dataset.label; }));
            var headers = validRows[0].map(function (cell) { return String(cell == null ? '' : cell).replace(/^\uFEFF/, '').trim(); });
            if (headers.length !== expected.length || headers.some(function (header, index) { return header !== expected[index]; })) {
                throw new Error('表头与当前组件不匹配，请使用本组件下载的模板，勿调整数据列');
            }
            var bodyRows = validRows.slice(1);
            if (bodyRows.some(function (row) { return row.length > expected.length && row.slice(expected.length).some(function (value) { return String(value || '').trim(); }); })) {
                throw new Error('数据列超出模板范围，请检查表格');
            }
            var candidate = clone(editDraft);
            candidate.data.labels = bodyRows.map(function (row) { return String(row[0] == null ? '' : row[0]).trim(); });
            candidate.data.datasets.forEach(function (dataset, index) {
                dataset.data = bodyRows.map(function (row) { return parseCellNumber(row[index + 1]); });
            });
            var error = validateRecord(candidate);
            if (error) throw new Error(error);
            flushDashboardHistory();
            editDraft.data = candidate.data;
            selectionRange = null;
            selectionAnchor = null;
            commitDashboardHistory();
            renderDashboardEditor();
            showToast('表格导入成功，请确认预览后保存');
        }

        function addCollectionItem() {
            if (!editDraft || ['case-list','definition-list'].indexOf(editDraft.type) < 0) return;
            if (editDraft.data.items.length >= 10) { showToast('最多可维护 10 条内容', 'error'); return; }
            if (editDraft.type === 'case-list') {
                editDraft.data.items.push(caseEntry('新增案例', 'images/solution-manufacturing.jpg', '成效提升', 0));
            } else {
                editDraft.data.items.push(definitionEntry('新增指标', '请输入指标口径说明。'));
            }
            renderStructuredEditor();
        }

        function removeCollectionItem(index) {
            if (!editDraft || ['case-list','definition-list'].indexOf(editDraft.type) < 0) return;
            if (editDraft.data.items.length <= 1) { showToast('至少保留 1 条内容', 'error'); return; }
            if (index < 0 || index >= editDraft.data.items.length) return;
            editDraft.data.items.splice(index, 1);
            renderStructuredEditor();
        }

        function updateFieldInput(target) {
            if (!editDraft) return false;
            var group = target.getAttribute('data-field-group') || target.getAttribute('data-field-label-group') || target.getAttribute('data-field-trend-group');
            var index = Number(target.getAttribute('data-field-index'));
            if (!group || !editDraft.data[group] || !editDraft.data[group][index]) return false;
            var item = editDraft.data[group][index];
            if (target.hasAttribute('data-field-label-group')) item.label = target.value;
            else if (target.hasAttribute('data-field-trend-group')) item.trendDirection = target.value;
            else {
                if (item.kind === 'image') return false;
                item.value = target.value;
            }
            if (editDraft.type === 'dashboard') {
                scheduleDashboardHistory();
                renderChartPreview();
            } else document.getElementById('dsPreviewArea').innerHTML = editDraft.type === 'metric' ? metricPreviewHtml() : structuredPreviewHtml();
            return true;
        }

        function readCaseImage(input) {
            var file = input.files && input.files[0];
            if (!file || !editDraft || editDraft.type !== 'case-list') return;
            if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 5 * 1024 * 1024) {
                input.value = '';
                showToast('请选择不超过 5 MB 的 PNG、JPG 或 WebP 图片', 'error');
                return;
            }
            var draft = editDraft;
            var token = ++imageReadToken;
            var index = Number(input.getAttribute('data-item-index'));
            var reader = new FileReader();
            imageLoading = true;
            function failed() {
                if (editDraft !== draft || token !== imageReadToken) return;
                imageLoading = false;
                input.value = '';
                showToast('图片读取失败，请选择有效图片', 'error');
            }
            reader.onerror = failed;
            reader.onload = function () {
                if (editDraft !== draft || token !== imageReadToken) return;
                var picture = new Image();
                picture.onerror = failed;
                picture.onload = function () {
                    if (editDraft !== draft || token !== imageReadToken) return;
                    if (!draft.data.items[index]) return failed();
                    draft.data.items[index].image = String(reader.result);
                    draft.data.items[index].crop = null;
                    imageLoading = false;
                    renderStructuredEditor();
                };
                picture.src = String(reader.result);
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('dsSearchBtn').addEventListener('click', applyFilters);
        document.getElementById('dsResetBtn').addEventListener('click', resetFilters);
        document.getElementById('dsNameFilter').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') applyFilters();
        });
        ['dsYearFilter','dsStatusFilter'].forEach(function (id) {
            document.getElementById(id).addEventListener('change', applyFilters);
        });

        screenNavItems.forEach(function (item) {
            item.addEventListener('click', function () {
                activeScreen = item.getAttribute('data-screen-nav');
                screenNavItems.forEach(function (navItem) {
                    navItem.classList.toggle('active', navItem === item);
                    if (navItem === item) navItem.setAttribute('aria-current', 'page');
                    else navItem.removeAttribute('aria-current');
                });
                applyFilters();
            });
        });

        body.addEventListener('click', function (event) {
            var action = event.target.closest('[data-action]');
            if (!action) return;
            var row = action.closest('tr[data-record-id]');
            var record = records.find(function (item) { return item.id === row.getAttribute('data-record-id'); });
            if (!record) return;
            if (action.getAttribute('data-action') === 'toggle') {
                record.enabled = !record.enabled;
                renderTable();
                showToast(record.name + '已' + (record.enabled ? '启用' : '设为未启用'));
            } else {
                openDrawer(record);
            }
        });

        pageList.addEventListener('click', function (event) {
            var button = event.target.closest('[data-page]');
            if (!button || button.disabled) return;
            currentPage = Number(button.getAttribute('data-page'));
            renderTable();
        });

        drawer.addEventListener('click', function (event) {
            if (event.target === drawer || event.target.closest('[data-drawer-close]') || event.target.closest('[data-drawer-cancel]')) closeDrawer();
            if (event.target.closest('[data-drawer-save]')) saveDrawer();
        });

        drawerBody.addEventListener('input', function (event) {
            if (!editDraft || event.target.type === 'file') return;
            if (event.target.hasAttribute('data-record-name')) {
                editDraft.name = event.target.value;
                var namePreview = document.getElementById('dsPreviewArea');
                if (namePreview) {
                    if (editDraft.type === 'metric') namePreview.innerHTML = metricPreviewHtml();
                    else if (editDraft.type === 'dashboard') renderChartPreview();
                    else namePreview.innerHTML = structuredPreviewHtml();
                }
                return;
            }
            if (updateFieldInput(event.target)) return;
            var seriesNameIndex = event.target.getAttribute('data-series-name-index');
            if (seriesNameIndex != null) {
                editDraft.data.datasets[Number(seriesNameIndex)].label = event.target.value;
                scheduleDashboardHistory();
                renderChartPreview();
                return;
            }
            var dashboardField = event.target.getAttribute('data-dashboard-field');
            if (dashboardField) {
                editDraft.data[dashboardField] = event.target.value;
                scheduleDashboardHistory();
                renderChartPreview();
                return;
            }
            var caseField = event.target.getAttribute('data-case-field');
            if (caseField) {
                var caseIndex = Number(event.target.getAttribute('data-item-index'));
                editDraft.data.items[caseIndex][caseField] = caseField === 'effectValue' ? parseCellNumber(event.target.value) : event.target.value;
                document.getElementById('dsPreviewArea').innerHTML = structuredPreviewHtml();
                return;
            }
            var definitionField = event.target.getAttribute('data-definition-field');
            if (definitionField) {
                var definitionIndex = Number(event.target.getAttribute('data-item-index'));
                editDraft.data.items[definitionIndex][definitionField] = event.target.value;
                document.getElementById('dsPreviewArea').innerHTML = structuredPreviewHtml();
                return;
            }
            var metricField = event.target.getAttribute('data-metric-field');
            if (metricField) {
                if (event.target.tagName === 'SELECT') return;
                editDraft.data[metricField] = event.target.value;
                document.getElementById('dsPreviewArea').innerHTML = metricPreviewHtml();
                return;
            }
            var role = event.target.getAttribute('data-table-role');
            if (!role) return;
            var rowIndex = Number(event.target.getAttribute('data-row'));
            if (role === 'label') editDraft.data.labels[rowIndex] = event.target.value;
            else {
                var seriesIndex = Number(event.target.getAttribute('data-series'));
                editDraft.data.datasets[seriesIndex].data[rowIndex] = parseCellNumber(event.target.value);
            }
            scheduleDashboardHistory();
            renderChartPreview();
        });

        drawerBody.addEventListener('mousedown', function (event) {
            var cell = event.target.closest('.ds-cell-input');
            if (!cell || event.button !== 0 || !editDraft || editDraft.type !== 'dashboard') return;
            var row = Number(cell.getAttribute('data-row'));
            var col = Number(cell.getAttribute('data-col'));
            if (!event.shiftKey || !selectionAnchor) selectionAnchor = { row:row, col:col };
            selectionRange = {
                startRow:selectionAnchor.row, startCol:selectionAnchor.col,
                endRow:row, endCol:col
            };
            dragSelecting = true;
            applySelectionClasses();
        });

        drawerBody.addEventListener('mouseover', function (event) {
            if (!dragSelecting || !selectionAnchor) return;
            var cell = event.target.closest('.ds-cell-input');
            if (!cell) return;
            selectionRange = {
                startRow:selectionAnchor.row, startCol:selectionAnchor.col,
                endRow:Number(cell.getAttribute('data-row')),
                endCol:Number(cell.getAttribute('data-col'))
            };
            applySelectionClasses();
        });

        drawerBody.addEventListener('click', function (event) {
            var collectionAction = event.target.closest('[data-collection-action]');
            if (collectionAction) {
                if (collectionAction.disabled) return;
                if (collectionAction.getAttribute('data-collection-action') === 'add') addCollectionItem();
                else removeCollectionItem(Number(collectionAction.getAttribute('data-item-index')));
                return;
            }
            var action = event.target.closest('[data-excel-action]');
            if (!action || action.disabled) return;
            var type = action.getAttribute('data-excel-action');
            if (type === 'undo') undoDashboard();
            else if (type === 'redo') redoDashboard();
            else if (type === 'delete') clearSelectedCells();
            else if (type === 'template') downloadExcelTemplate();
        });

        drawerBody.addEventListener('copy', function (event) {
            if (!event.target.closest('.ds-cell-input') || !selectionRange || !editDraft || editDraft.type !== 'dashboard') return;
            var text = selectedRangeText();
            if (!event.clipboardData || text === '') return;
            event.preventDefault();
            event.clipboardData.setData('text/plain', text);
            showToast('已复制 ' + selectionCellCount() + ' 个单元格');
        });

        drawerBody.addEventListener('paste', function (event) {
            var target = event.target.closest('.ds-cell-input');
            if (!target || !editDraft || editDraft.type !== 'dashboard') return;
            var text = event.clipboardData && event.clipboardData.getData('text/plain');
            if (text == null) return;
            event.preventDefault();
            pasteDashboardCells(target, text);
        });

        drawerBody.addEventListener('change', function (event) {
            if (!editDraft) return;
            var target = event.target;
            if (target.type === 'file' && target.hasAttribute('data-case-image')) {
                readCaseImage(target);
                return;
            }
            if (updateFieldInput(target)) return;
            var metricField = target.getAttribute('data-metric-field');
            if (metricField) {
                editDraft.data[metricField] = target.value;
                if (metricField === 'trendMode') {
                    if (target.value === 'count' && editDraft.data.trendUnit === '%') editDraft.data.trendUnit = editDraft.data.unit;
                    renderMetricEditor();
                } else document.getElementById('dsPreviewArea').innerHTML = metricPreviewHtml();
                return;
            }
            if (target.id !== 'dsImportInput') return;
            var file = target.files && target.files[0];
            if (!file) return;
            var draft = editDraft;
            var token = ++importReadToken;
            importLoading = true;
            workbookRows(file).then(function (rows) {
                if (editDraft !== draft || token !== importReadToken) return;
                importLoading = false;
                applyImportedRows(rows);
            }).catch(function (error) {
                if (editDraft !== draft || token !== importReadToken) return;
                importLoading = false;
                target.value = '';
                showToast(error.message || '表格导入失败', 'error');
            });
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && drawer.classList.contains('show')) {
                closeDrawer();
                return;
            }
            if (!drawer.classList.contains('show') || !editDraft || editDraft.type !== 'dashboard') return;
            if (!event.target.closest('.ds-cell-input')) return;
            var key = event.key.toLowerCase();
            var shortcut = event.ctrlKey || event.metaKey;
            if (shortcut && key === 'z') {
                event.preventDefault();
                if (event.shiftKey) redoDashboard();
                else undoDashboard();
                return;
            }
            if (shortcut && key === 'y') {
                event.preventDefault();
                redoDashboard();
                return;
            }
            if ((event.key === 'Delete' || event.key === 'Backspace') && selectionRange) {
                event.preventDefault();
                clearSelectedCells();
            }
        });

        document.addEventListener('mouseup', function () { dragSelecting = false; });

        renderTable();
    })();
    </script>
    <script src="js/operation-sidebar.js"></script>
    <script src="js/admin-topbar.js"></script>
</body>
</html>
