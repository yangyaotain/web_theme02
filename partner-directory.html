<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伙伴目录 · 灵拓数据聚合服务平台</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/service-application-modal.css">
    <link rel="stylesheet" href="css/monitor-pages.css">
    <link rel="stylesheet" href="css/feature-introduction.css">
    <link rel="stylesheet" href="css/catalog-cards.css">
    <link rel="stylesheet" href="css/ecosystem-partners.css">
</head>
<body>
    <nav-bar active="data-ecosystem"></nav-bar>
    <main class="partner-directory">
        <nav class="g-breadcrumb" aria-label="当前位置">
            <a href="index.html">首页</a><span class="sep" aria-hidden="true">/</span>
            <span>生态聚合</span><span class="sep" aria-hidden="true">/</span>
            <span class="current" aria-current="page">伙伴目录</span>
        </nav>
        <header class="page-header">
            <div class="page-header-container"><h1 class="page-title">伙伴目录</h1></div>
        </header>
        <section class="partner-directory-content" aria-label="生态伙伴列表">
            <div class="partner-directory-tools">
                <p data-partner-count role="status"></p>
                <form class="partner-directory-search" role="search">
                    <input type="search" name="keyword" aria-label="搜索伙伴名称" placeholder="搜索伙伴名称">
                    <button type="submit" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg>
                        <span>搜索</span>
                    </button>
                </form>
            </div>
            <div class="data-grid" data-partner-grid></div>
            <p class="partner-directory-empty" data-partner-empty hidden></p>
        </section>
    </main>
    <script src="js/partner-store.js"></script>
    <script src="js/partner-ui.js"></script>
    <script src="js/feature-introduction.js"></script>
    <script src="js/nav-bar.js"></script>
    <script src="js/partner-directory.js"></script>
</body>
</html>
