<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业解决方案 - 龙岗数据聚合服务平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/detail-favorite.css">
    <link rel="stylesheet" href="css/service-catalog.css">
    <link rel="stylesheet" href="css/industry-solutions.css">
    <script src="js/nav-bar.js" defer></script>
    <script src="js/smart-service.js" defer></script>
    <script src="js/global-dialog.js" defer></script>
    <script src="js/detail-favorite.js" defer></script>
    <script src="js/industry-solution-catalog.js" defer></script>
    <script src="js/industry-solutions.js" defer></script>
</head>
<body>
    <nav-bar active="data-services"></nav-bar>
    <main class="main-content">
        <aside class="service-sidebar has-tree" aria-label="行业解决方案目录">
            <div class="solution-tree" aria-live="polite"></div>
        </aside>
        <div class="content-area" aria-live="polite"></div>
    </main>
    <div class="consult-overlay" id="consultOverlay">
        <div class="consult-card">
            <button class="consult-close" id="consultClose" title="关闭" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
                <span class="consult-close-label">关闭</span>
            </button>
            <form id="consultForm" autocomplete="off">
                <div class="consult-row">
                    <div class="consult-label">咨询对象</div>
                    <div class="consult-val consult-static" id="consultTarget">园区企业数据治理与资源目录建设方案</div>
                </div>
                <div class="consult-row">
                    <div class="consult-label">咨询内容</div>
                    <div class="consult-val">
                        <div class="consult-ta-wrap">
                            <textarea class="consult-textarea" id="txtConsult" maxlength="500" required aria-label="咨询内容" placeholder="请输入您的咨询内容"></textarea>
                            <span class="consult-count"><span id="consultCount">0</span>/500</span>
                        </div>
                    </div>
                </div>
                <div class="consult-row">
                    <div class="consult-label">机构名称：</div>
                    <div class="consult-val consult-static" style="font-weight:400">智慧数据科技有限公司</div>
                </div>
                <div class="consult-row">
                    <div class="consult-label">联系人姓名：</div>
                    <div class="consult-val"><input type="text" class="consult-input" value="张三" placeholder="请输入姓名"></div>
                </div>
                <div class="consult-row">
                    <div class="consult-label">联系人电话：</div>
                    <div class="consult-val"><input type="tel" class="consult-input" value="15812343213" placeholder="请输入电话"></div>
                </div>
                <div class="consult-row">
                    <div class="consult-label">联系人邮箱：</div>
                    <div class="consult-val"><input type="email" class="consult-input" value="dianzyun001@cestc.cn" placeholder="请输入邮箱地址"></div>
                </div>
                <div class="consult-actions">
                    <button type="submit" class="consult-btn-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 16.2-3.5-3.5L4.1 14.1 9 19 20.3 7.7l-1.4-1.4L9 16.2z"/></svg>确定</button>
                    <button type="button" class="consult-btn-cancel" id="consultCancel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>取消</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
