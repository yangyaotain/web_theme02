<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面建设中 - 龙岗数据聚合服务平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 16% 14%, rgba(32, 165, 101, 0.07), transparent 30%),
                var(--bg-main);
        }

        .placeholder-main {
            width: 100%;
            max-width: var(--content-max-width);
            min-height: 590px;
            margin: 0 auto;
            padding: 104px 32px 48px;
            flex: 1;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .breadcrumb a:hover { color: var(--forest-green); }
        .breadcrumb-separator { color: var(--border-default); }

        .placeholder-card {
            min-height: 390px;
            padding: 56px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-md);
        }

        .placeholder-icon {
            width: 76px;
            height: 76px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest-green);
            background: linear-gradient(145deg, var(--forest-green-50), rgba(32, 165, 101, 0.14));
            border: 1px solid var(--forest-green-200);
            border-radius: 22px;
        }

        .placeholder-icon svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-title {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .placeholder-status {
            margin-top: 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--forest-green-700);
        }

        .placeholder-desc {
            max-width: 520px;
            margin: 10px 0 0;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-tertiary);
        }

        @media (max-width: 768px) {
            .placeholder-main { padding: 88px 20px 32px; }
            .placeholder-card { min-height: 350px; padding: 40px 20px; }
            .page-title { font-size: 26px; }
        }
    </style>
    <script src="js/nav-bar.js"></script>
</head>
<body>
    <nav-bar></nav-bar>

    <main class="placeholder-main">
        <nav class="breadcrumb" aria-label="面包屑">
            <a href="index.html">首页</a>
            <span class="breadcrumb-separator">/</span>
            <span id="primaryLabel"></span>
            <span class="breadcrumb-separator" id="secondarySeparator">/</span>
            <span id="secondaryLabel"></span>
            <span class="breadcrumb-separator">/</span>
            <span id="currentLabel"></span>
        </nav>

        <section class="placeholder-card">
            <div class="placeholder-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19.5V6.8c0-.9.7-1.6 1.6-1.6h12.8c.9 0 1.6.7 1.6 1.6v12.7"></path>
                    <path d="M2.8 19.5h18.4"></path>
                    <path d="M8 9h8M8 13h5"></path>
                </svg>
            </div>
            <h1 class="page-title" id="pageTitle">页面建设中</h1>
            <div class="placeholder-status">页面内容建设中</div>
            <p class="placeholder-desc">该模块正在规划完善，当前仅作为导航入口占位展示。</p>
        </section>
    </main>


    <script>
        (function () {
            var pages = {
                'corpus-data-zone': { primary: '数据交易', secondary: '特色专区', title: '语料数据专区' },
                'city-governance-zone': { primary: '数据交易', secondary: '特色专区', title: '城市治理专区' },
                'medical-health-zone': { primary: '数据交易', secondary: '特色专区', title: '医疗健康专区' },
                'embodied-intelligence-zone': { primary: '数据交易', secondary: '特色专区', title: '具身智能专区' },
                'merchant-onboarding': { primary: '数据生态', secondary: '', title: '数商入驻' },
                'ecosystem-cooperation': { primary: '数据生态', secondary: '', title: '生态合作' },
                'industry-education': { primary: '数据生态', secondary: '', title: '产教融合' }
            };
            var key = new URLSearchParams(window.location.search).get('page') || '';
            var page = pages[key] || { primary: '首页', secondary: '', title: '页面建设中' };
            var secondaryLabel = document.getElementById('secondaryLabel');
            var secondarySeparator = document.getElementById('secondarySeparator');

            document.title = page.title + ' - 龙岗数据聚合服务平台';
            document.getElementById('primaryLabel').textContent = page.primary;
            document.getElementById('currentLabel').textContent = page.title;
            document.getElementById('pageTitle').textContent = page.title;

            if (page.secondary) {
                secondaryLabel.textContent = page.secondary;
            } else {
                secondaryLabel.hidden = true;
                secondarySeparator.hidden = true;
            }
        })();
    </script>
</body>
</html>
